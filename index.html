<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Kaushan+Script|Poppins&display=swap"
      rel="stylesheet"
    />
    <title>Calculator Web App</title>
  </head>
  <body>
    <div id="app">
      <div id="history"></div>
      <input id="result" type="number" disabled>
      <div id="numandop">
        <div id="number">
          <div id="oprow">
            <div id="clear">AC</div>
            <div id="plusminus">+/-</div>
            <div id="modulus">%</div>
            <div id="divide">/</div>
          </div>
          <div id="numrow">
            <button id="seven">7</button>
            <button id="eight">8</button>
            <button id="nine">9</button>
            <div id="multiply">*</div>
          </div>
          <div id="numrow1">
            <button id="four">4</button>
            <button id="five">5</button>
            <button id="six">6</button>
            <div id="subtract">-</div>
          </div>
          <div id="numrow2">
            <button id="one">1</button>
            <button id="two">2</button>
            <button id="three">3</button>
            <div id="add">+</div>
          </div>
          <div id="numrow3">
            <button id="zero">0</button>
            <button id="decimal">.</button>
            <div id="backspace" >
              <svg
                height="35"
                width="35"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M19 5H9.83a3 3 0 0 0-2.12.88l-5.42 5.41a1 1 0 0 0 0 1.42l5.42 5.41a3 3 0 0 0 2.12.88H19a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3Zm1 11a1 1 0 0 1-1 1H9.83a1.05 1.05 0 0 1-.71-.29L4.41 12l4.71-4.71A1.05 1.05 0 0 1 9.83 7H19a1 1 0 0 1 1 1Zm-3.29-6.71a1 1 0 0 0-1.42 0L14 10.59l-1.29-1.3a1 1 0 0 0-1.42 1.42l1.3 1.29l-1.3 1.29a1 1 0 0 0 0 1.42a1 1 0 0 0 1.42 0l1.29-1.3l1.29 1.3a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.42L15.41 12l1.3-1.29a1 1 0 0 0 0-1.42Z"
                  fill="currentColor"
                />
              </svg>
            </div>
            <div id="buttoneq">=</div>
          </div>
        </div>
      </div>
    <script src="app/script.js"></script>
    </div>
  </body>
</html>
